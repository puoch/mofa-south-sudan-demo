id: editorial
label: 'Ministry editorial workflow'
type: content_moderation
type_settings:
  states:
    approved:
      label: 'Approved for publication'
      weight: 0
    archived:
      label: 'Archived (public in Archives)'
      weight: 10
      published: true
      default_revision: true
    draft:
      label: Draft
      weight: -10
      published: false
      default_revision: false
    published:
      label: Published
      weight: 5
      published: true
      default_revision: true
    review:
      label: 'In review'
      weight: -5
    withdrawn:
      label: 'Withdrawn (not public)'
      weight: 15
      published: false
      default_revision: true
  transitions:
    approve:
      label: Approve
      from:
        - review
      to: approved
      weight: 3
    archive:
      label: Archive
      from:
        - published
      to: archived
      weight: 5
    create_new_draft:
      label: 'Save draft'
      from:
        - draft
        - published
      to: draft
      weight: 0
    publish:
      label: Publish
      from:
        - approved
      to: published
      weight: 4
    request_changes:
      label: 'Return to draft'
      from:
        - approved
        - review
      to: draft
      weight: 2
    restore_to_draft:
      label: 'Restore to draft'
      from:
        - archived
        - withdrawn
      to: draft
      weight: 6
    submit_for_review:
      label: 'Submit for review'
      from:
        - draft
      to: review
      weight: 1
    withdraw:
