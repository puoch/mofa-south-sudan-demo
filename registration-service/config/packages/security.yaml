security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        staff_users:
            entity:
                class: App\Entity\StaffUser
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # The public form needs no sign-in and shares no session with staff.
        public:
            pattern: ^/(register|privacy|$)
            security: false
        staff:
            pattern: ^/staff
            lazy: true
            provider: staff_users
            custom_authenticators:
                - App\Security\StaffAuthenticator
            entry_point: App\Security\StaffAuthenticator
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: staff_logout
                target: staff_login
                enable_csrf: true

    role_hierarchy: {}

    access_control:
        - { path: ^/staff/login$, roles: PUBLIC_ACCESS }
        - { path: ^/staff/accounts, roles: ROLE_ACCOUNT_ADMIN }
        - { path: ^/staff/audit, roles: ROLE_HQ_OVERSIGHT }
        - { path: ^/staff, roles: ROLE_STAFF }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
