$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Link tiles
status: stable
description: Grid of pathways to child pages, used by the About South Sudan gateway and section landing pages.
props:
  type: object
  required: [items]
  properties:
    heading: { type: string, title: Heading }
    items:
      type: array
      title: Tiles
      items:
        type: object
        properties:
          title: { type: string }
          url: { type: string }
          description: { type: string }
