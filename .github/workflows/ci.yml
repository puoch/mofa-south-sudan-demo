name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mofa
          POSTGRES_USER: mofa
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mofa" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_NAME: mofa
      DB_USER: mofa
      DB_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DATABASE_URL: postgresql://mofa_registry:ci-only-registry@127.0.0.1:5432/mofa_registry?serverVersion=16&charset=utf8
      DRUPAL_ERROR_LEVEL: verbose
      MOFA_ENVIRONMENT: ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, gd, intl, mbstring, opcache, sodium
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint custom PHP
        run: find web/modules/custom web/themes/custom tests/drush -name '*.php' -o -name '*.theme' -o -name '*.module' | xargs -n1 php -l

      - name: Scan for committed secrets
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git . --redact --verbose
          rm gitleaks

      - name: Registration prototype shares the theme's design tokens
        run: |
          for f in tokens.css base.css forms.css; do
            diff -u "web/themes/custom/mofa_theme/css/$f" "registration-service/public/css/shared/$f"
          done

      - name: Install registration prototype
        working-directory: registration-service
        env:
          PGPASSWORD: ci-only-password
        run: |
          psql -h 127.0.0.1 -U mofa -d mofa -c "CREATE ROLE mofa_registry LOGIN PASSWORD 'ci-only-registry' CREATEDB"
          psql -h 127.0.0.1 -U mofa -d mofa -c "CREATE DATABASE mofa_registry OWNER mofa_registry"
          psql -h 127.0.0.1 -U mofa -d mofa -c "CREATE DATABASE mofa_registry_test OWNER mofa_registry"
          composer install --no-interaction --no-progress --prefer-dist
          find src tests migrations -name '*.php' | xargs -n1 php -l
          {
            echo "APP_SECRET=$(php -r 'echo bin2hex(random_bytes(16));')"
            echo "REGISTRY_FIELD_KEY=$(php -r 'echo base64_encode(random_bytes(32));')"
            echo "REGISTRY_INDEX_KEY=$(php -r 'echo base64_encode(random_bytes(32));')"
            # PHP's built-in web server does not pass process environment
            # variables to the app, so the URL must be in .env.local too.
            echo "DATABASE_URL=\"$DATABASE_URL\""
          } > .env.local
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console doctrine:migrations:migrate --no-interaction --env=test
          php bin/console doctrine:schema:validate
          php bin/console lint:container
          php bin/console lint:twig templates
          php bin/console registry:seed-missions
          php bin/console registry:seed-synthetic --count=30
          # Demo staff credentials exist only for this run.
          REGISTRY_DEMO_PASSWORD="$(php -r 'echo bin2hex(random_bytes(12));')"
          REGISTRY_DEMO_TOTP_SECRET="$(php -r 'require "vendor/autoload.php"; echo App\Security\Totp::generateSecret();')"
          echo "::add-mask::$REGISTRY_DEMO_PASSWORD"
          echo "::add-mask::$REGISTRY_DEMO_TOTP_SECRET"
          echo "REGISTRY_DEMO_PASSWORD=$REGISTRY_DEMO_PASSWORD" >> "$GITHUB_ENV"
          echo "REGISTRY_DEMO_TOTP_SECRET=$REGISTRY_DEMO_TOTP_SECRET" >> "$GITHUB_ENV"
          REGISTRY_DEMO_PASSWORD="$REGISTRY_DEMO_PASSWORD" REGISTRY_DEMO_TOTP_SECRET="$REGISTRY_DEMO_TOTP_SECRET" php bin/console registry:seed-staff --set=desktop --set=mobile

      - name: Registration prototype unit and functional tests
        working-directory: registration-service
        run: php bin/phpunit

      - name: Install site from configuration
        run: |
          export DRUPAL_HASH_SALT="$(php -r 'echo bin2hex(random_bytes(32));')"
          echo "DRUPAL_HASH_SALT=$DRUPAL_HASH_SALT" >> "$GITHUB_ENV"
          ADMIN_PASS="$(php -r 'echo bin2hex(random_bytes(8));')" ./scripts/install-from-config.sh

      - name: Configuration matches the database
        run: vendor/bin/drush config:status 2>&1 | tee /dev/stderr | grep -q "No differences"

      - name: Start web server
        run: |
          cd web
          php -S 127.0.0.1:8080 .ht.router.php > /tmp/php-server.log 2>&1 &
          sleep 2
          curl --fail -s -o /dev/null http://127.0.0.1:8080/styleguide
          cd ../registration-service/public
          php -S 127.0.0.1:8081 > /tmp/registry-server.log 2>&1 &
          sleep 2
          curl --fail -s -o /dev/null http://127.0.0.1:8081/register

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: End-to-end, accessibility and reflow tests
        working-directory: tests/e2e
        env:
          REGISTRY_URL: http://127.0.0.1:8081
        run: npx playwright test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/report
          retention-days: 14
