$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Card
status: stable
description: Teaser for news items, missions, services and publications.
props:
  type: object
  required: [heading]
  properties:
    heading: { type: string, title: Heading }
    url: { type: string, title: Link URL }
    summary: { type: string, title: Summary }
    meta: { type: string, title: Meta line (date or category) }
    image_label: { type: string, title: Placeholder image description (omit for no image) }
    placeholder: { type: boolean, title: Show placeholder badge }
    heading_level: { type: integer, title: Heading level, enum: [2, 3, 4] }
